name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream "https://github.com/${{ github.event.repository.parent.full_name }}.git"
          git fetch upstream

          git checkout "${{ github.event.repository.default_branch }}"
          git reset --hard "upstream/${{ github.event.repository.default_branch }}"

          git push origin "${{ github.event.repository.default_branch }}" --force
