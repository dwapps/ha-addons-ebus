name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/LukasGrebe/ha-addons.git
          git fetch upstream main

          git checkout main

          # Übernimmt alle Änderungen vom Upstream,
          # außer Dateien unter .github/workflows/
          git diff --binary HEAD upstream/main -- . \
            ':(exclude).github/workflows/**' \
            > /tmp/upstream.patch

          if [ -s /tmp/upstream.patch ]; then
            git apply --index /tmp/upstream.patch
            git commit -m "Sync upstream"
            git push origin main
            exit 0
          fi

          echo "Keine neuen Upstream-Änderungen."
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          if (( now - last_commit >= 30 * 24 * 60 * 60 )); then
            git commit --allow-empty -m "Keep scheduled sync active"
            git push origin main
          fi
