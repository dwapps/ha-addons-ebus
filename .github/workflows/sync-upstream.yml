name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/LukasGrebe/ha-addons.git
          git fetch upstream main

          git checkout main

          # Übernimmt alle Änderungen vom Upstream,
          # außer Dateien unter .github/workflows/
          git diff --binary HEAD upstream/main -- . \
            ':(exclude).github/workflows/**' \
            > /tmp/upstream.patch

          if [ ! -s /tmp/upstream.patch ]; then
            echo "Keine neuen Upstream-Änderungen."
            exit 0
          fi

          git apply --index /tmp/upstream.patch
          git commit -m "Sync upstream"
          git push origin main
